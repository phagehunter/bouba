    <style>
      @font-face { font-family: "Fredoka"; src: url("./fonts/Fredoka-variable.ttf") format("truetype"); font-weight: 300 700; font-style: normal; font-display: swap; }
      body { margin: 0; background: #f4f3ee; }
      #loading { --l-bg: #f4f3ee; --l-brand: #5b3f8c; --l-brand-2: #8f76c4; position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: var(--l-bg); }
      @media (prefers-color-scheme: dark) {
        body { background: #12171a; }
        #loading { --l-bg: #12171a; --l-brand: #b9a2e6; --l-brand-2: #8f76c4; }
      }
      #loading svg { display: block; width: 150px; max-width: 60vw; height: auto; }
      #loading .l-big { fill: var(--l-brand); animation: l-big 2.8s infinite; }
      #loading .l-small { fill: var(--l-brand-2); animation: l-small 2.8s infinite; }
      #loading p { margin: 0; font: 600 1.05rem/1.2 "Fredoka", ui-rounded, system-ui, sans-serif; color: var(--l-brand); }
      #loading i { font-style: normal; opacity: 0; animation: 1.2s infinite; }
      #loading i:nth-child(1) { animation-name: l-dot-1; }
      #loading i:nth-child(2) { animation-name: l-dot-2; }
      #loading i:nth-child(3) { animation-name: l-dot-3; }
      /* The large form swells by 7%, then the small one by 9%. Each rise and fall is a smooth ease, and nothing turns. */
      @keyframes l-big {
        0% { transform: translate(-20px, 5px) scale(1) translate(20px, -5px); animation-timing-function: cubic-bezier(0.37, 0, 0.63, 1); }
        30% { transform: translate(-21.2px, 5px) scale(1.07) translate(20px, -5px); animation-timing-function: cubic-bezier(0.37, 0, 0.63, 1); }
        61%, 100% { transform: translate(-20px, 5px) scale(1) translate(20px, -5px); }
      }
      @keyframes l-small {
        0%, 27% { transform: translate(27px, -9px) scale(1) translate(-27px, 9px); animation-timing-function: cubic-bezier(0.37, 0, 0.63, 1); }
        58% { transform: translate(28.5px, -10.2px) scale(1.09) translate(-27px, 9px); animation-timing-function: cubic-bezier(0.37, 0, 0.63, 1); }
        89%, 100% { transform: translate(27px, -9px) scale(1) translate(-27px, 9px); }
      }
      /* The dots appear one at a time, about 0.3 s apart, then clear. They keep their space, so the word does not shift. */
      @keyframes l-dot-1 { 0%, 19% { opacity: 0; } 25%, 94% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes l-dot-2 { 0%, 44% { opacity: 0; } 50%, 94% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes l-dot-3 { 0%, 69% { opacity: 0; } 75%, 94% { opacity: 1; } 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        #loading .l-big, #loading .l-small, #loading i { animation: none; }
        #loading i { opacity: 1; }
      }
    </style>
